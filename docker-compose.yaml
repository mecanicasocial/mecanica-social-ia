version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AMBIENTE=development
      - API_KEY_ESCUELA_TOKEN=ms_ia_secure_token_int_001_env_secured
      - MS_IA_MODEL_BASE_URL=http://fake_llm:8001/v1
      - MS_IA_MODEL_API_KEY=mock_key
      - MS_IA_MODEL_ID=fake-llm-advanced-7b
      - MODEL_TIMEOUT_SECONDS=30
    volumes:
      - ./data:/workspaces/mecanica-social-ia/data
    depends_on:
      - fake_llm

  fake_llm:
    build:
      context: .
      dockerfile: Dockerfile.mock
    ports:
      - "8001:8001"
    environment:
      - AMBIENTE=development
    volumes:
      - ./data:/workspaces/mecanica-social-ia/data
