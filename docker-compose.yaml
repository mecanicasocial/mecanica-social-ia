services:
  # 1. El Runtime del Servidor Web (FastAPI / API REST Asíncrona)
  api-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms_api_runtime_container
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=src
      - AMBIENTE=development
      - API_KEY_ESCUELA_TOKEN=ms_ia_secure_token_int_001_env_secured
      - MS_IA_MODEL_API_KEY=mock_local_secret_key
      - ESCUELA_WEBHOOK_URL=http://mock-provider-ia:8001/webhooks/escuela-intake
      - ESCUELA_NOTIFICACION_URL=http://mock-provider-ia:8001/webhooks/escuela-output
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
    depends_on:
      - mock-provider-ia
    networks:
      - red-mecanica-social-ia

  # 2. El Proveedor de IA Simulado y Mock Receptor Inteligente de la Escuela
  mock-provider-ia:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: ms_mock_ia_container
    ports:
      - "8001:8001"
    networks:
      - red-mecanica-social-ia

networks:
  red-mecanica-social-ia:
    driver: bridge
