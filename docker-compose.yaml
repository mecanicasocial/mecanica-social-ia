services:
  # 1. El Runtime del Servidor Web (FastAPI / API REST Asíncrona)
  api-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms_api_runtime_container
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=${PYTHONPATH}
      - AMBIENTE=${AMBIENTE}
      - API_KEY_ESCUELA_TOKEN=${API_KEY_ESCUELA_TOKEN}
      - MS_IA_MODEL_API_KEY=${MS_IA_MODEL_API_KEY}
      - ESCUELA_WEBHOOK_URL=${ESCUELA_WEBHOOK_URL}
      - ESCUELA_NOTIFICACION_URL=${ESCUELA_NOTIFICACION_URL}
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
    depends_on:
      - mock-provider-ia
    networks:
      - red-mecanica-social-ia

  # 2. El Proveedor de IA Simulado y Mock Receptor Inteligente de la Escuela
  mock-provider-ia:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: ms_mock_ia_container
    ports:
      - "8001:8001"
    networks:
      - red-mecanica-social-ia

networks:
  red-mecanica-social-ia:
    driver: bridge
