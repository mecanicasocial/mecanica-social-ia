[pytest]
testpaths = app
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Filtros universales de advertencias (Mantenimiento de Consola Prístina)
filterwarnings =
    ignore::pytest.PytestConfigWarning
    ignore:.*httpx.*:DeprecationWarning
    ignore:.*metaschema.*:DeprecationWarning
    ignore:.*install `httpx2` instead.*:DeprecationWarning
    ignore:.*TestClient.*:DeprecationWarning
    ignore:.*starlette.*:DeprecationWarning
