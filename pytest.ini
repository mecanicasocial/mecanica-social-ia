[pytest]
# 1. Registra automáticamente la carpeta src en las rutas del sistema de Python
pythonpath = src

# 2. Silencia las alertas de obsolescencia basadas en texto sin importar su módulo interno
filterwarnings =
    ignore:.*StarletteDeprecationWarning.*
    ignore:.*PydanticDeprecatedSince20.*
    ignore::DeprecationWarning
