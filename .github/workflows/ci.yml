name: Suite de Regresión Robótica (Pytest)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pytest-ci:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Clonar el código fuente del repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: 3. Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Ejecutar la suite completa
      run: |
        python -m pytest app/ -v
