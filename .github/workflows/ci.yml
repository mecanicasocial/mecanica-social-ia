name: Pipeline de Integración Continua (CI) - INT-001

# Definimos que el robot corra ante cada push o PR en la rama principal
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pruebas-automatizadas:
    name: Suite de Regresión Robótica (Pytest)
    runs-on: ubuntu-latest
    steps:
    - name: 1. Clonar el código fuente del repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar el entorno oficial de Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip' # Optimiza la velocidad guardando en caché las librerías
    - name: 3. Instalar librerías y dependencias del Runtime
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov

    - name: 4. Ejecutar la suite de 7 pruebas unitarias en la nube
      # Inyectamos de forma temporal secretos sintéticos para que pasen las firmas de los tokens
      env:
        API_KEY_ESCUELA_TOKEN: "ms_ia_secure_token_int_001_env_secured"
        MS_IA_MODEL_API_KEY: "fallback_empty_key"
      run: |
        python -m pytest app/test_api.py -v
