name: Suite de Regresión Robótica (Pytest)

on:
  push:
    branches: [ main, sec/fase2-pr6-datos-consentimiento ]
  pull_request:
    branches: [ main ]

jobs:
  pytest-ci:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Clonar el código fuente del repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar el entorno oficial de Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: 3. Instalar librerías y dependencias del Runtime (Criptografía Incluida)
      run: |
        python -m pip install --upgrade pip
        pip install pytest fastapi httpx uvicorn jsonschema pydantic python-dotenv pyyaml cryptography

    - name: 4. Ejecutar toda la suite de pruebas unitarias en la nube
      env:
        API_KEY_ESCUELA_TOKEN: "ms_ia_secure_token_int_001_env_secured"
        MS_IA_MODEL_API_KEY: "mock_key"
        AMBIENTE: "development"
      run: |
        python -m pytest app/ -v

    - name: 5. Validar la Reproducibilidad de la Infraestructura en Contenedores (Docker Build)
      run: |
        docker compose build
