id: formulario-intake
version: 1.0.0
estado: prueba
autor: nombre
fecha_creacion: 2026-09-06
fecha_revision: 2026-09-10

proposito: |
  Procesar solicitudes de participación en programas de formación
  y extraer información estructurada de beneficiarios.

# Ejemplo de metadatos y formato. NO es un componente operativo ni
# autorizado para uso institucional. Suite canónica offline:
# evaluations/casos-prueba/intake-test-set.yaml (no basta para promoción).
alcance: ejemplo-no-operativo

area_responsable: "Formación Institucional"
personas_afectadas: ["Beneficiarios", "Coordinadores de programas"]
# PII de beneficiarios (nombre, email, teléfono) → riesgo medio mínimo
# según DATA_GOVERNANCE.md y gobernanza-rapida.md.
nivel_riesgo: medio

datos_permitidos:
  - Nombre
  - Email
  - Teléfono
  - Motivación

datos_prohibidos:
  - Datos bancarios
  - Información de vulnerabilidad sensible
  - Datos de familia

fuentes_autorizadas:
  - Formulario web institucional
  - Base de datos interna aprobada

limitaciones_conocidas:
  - No valida direcciones fuera de Chile
  - Sensible a caracteres especiales
  - Evidencia formal solo offline (estructural); no mide el modelo
  - Un solo ejemplo embebido; la suite canónica vive en evaluations/casos-prueba/

prompt_text: |
  Eres un asistente que procesa solicitudes de capacitación.

  Tu tarea:
  1. Extrae: nombre, email, teléfono, razón de interés
  2. Estructura la salida en JSON
  3. Marca campos faltantes con "NO_PROPORCIONADO"

  NUNCA:
  - Inventes información
  - Edites el formato de email/teléfono
  - Hables de dinero o costos

  Input: {% verbatim %}{{ texto_formulario }}{% endverbatim %}
  Output format:
  {
    "nombre": "...",
    "email": "...",
    "telefono": "...",
    "interes": "..."
  }

ejemplos:
  - input: |
      Hola, me llamo Carlos. Quiero participar en el programa de
      liderazgo. Mi correo es carlos@mail.com y mi teléfono es
      +56 9 1234 5678.
    expected: |
      {
        "nombre": "Carlos",
        "email": "carlos@mail.com",
        "telefono": "+56 9 1234 5678",
        "interes": "Programa de liderazgo"
      }

evaluacion:
  suite_canonica: evaluations/casos-prueba/intake-test-set.yaml
  metricas:
    - tipo: exactitud_extraccion
      objetivo: ≥95%
      metodo: Comparar con ground truth manual (requiere modo model)
    - tipo: coherencia_estructura
      objetivo: 100%
      metodo: JSON válido en todas las respuestas

  criterios_aceptacion:
    - "Todos los campos requeridos presentes"
    - "No hay respuestas vacías cuando info disponible"
    - "Formato JSON correcto"
  # Evidencia formal solo bajo evaluations/. Offline = estructural, no promoción.
  evidencia_formal: offline-estructural

supervision_humana:
  requerida: sí
  forma: "Revisor manual valida al menos 30% de respuestas y 100% de casos con PII incompleta o ambigua"
  frecuencia: "Diaria en piloto; semanal en régimen, o si error > 3%"
  responsable: "Coordinador de Formación"

revisiones:
  - fecha: 2026-09-06
    version: 1.0.0
    cambio: "Versión inicial de ejemplo (metadatos y formato)"
    revisado_por: "Equipo Técnico"
    aprobado_por: "N/A — sin aprobación operativa"
  - fecha: 2026-09-10
    version: 1.0.0
    cambio: |
      P0 auditoría: estado aprobado→prueba; riesgo bajo→medio;
      alcance ejemplo-no-operativo; supervisión alineada a PII;
      evidencia formal pendiente en evaluations/.
    revisado_por: "Auditoría arquitectura"
    aprobado_por: "N/A — sin aprobación operativa"
  - fecha: 2026-09-10
    version: 1.0.0
    cambio: |
      P1 MVP: enlaza suite_canonica intake-test-set.yaml;
      evidencia_formal offline-estructural (no operativa).
    revisado_por: "MVP evaluación ejecutable"
    aprobado_por: "N/A — sin aprobación operativa"
