id: formulario-intake
version: 1.0.0
estado: prueba
autor: "@LeodanZapata"
fecha_creacion: 2026-09-06
fecha_revision: 2026-10-01

proposito: |
  Procesar solicitudes de participación en programas de formación
  y extraer información estructurada de beneficiarios, incluyendo la
  calificación preliminar de criterios de admisión (40/30/30).

alcance: ejemplo-no-operativo

area_responsable: "Formación Institucional"
personas_afectadas: ["Beneficiarios", "Coordinadores de programas"]
nivel_riesgo: medio

datos_permitidos:
  - Nombre
  - Email
  - Teléfono
  - Motivación
  - Calificaciones de criterios de admisión (misión, tiempo, territorio)

datos_prohibidos:
  - Datos bancarios
  - Información de vulnerabilidad sensible
  - Datos de familia
  - Datos de salud
  - Identificadores oficiales (RUT u otros) salvo autorización expresa

fuentes_autorizadas:
  - Formulario web institucional (cuando exista autorización)
  - Casos sintéticos de evaluación en evaluations/casos-prueba/

limitaciones_conocidas:
  - No valida direcciones fuera de Chile
  - Sensible a caracteres especiales
  - Estado "prueba": sin evidencia de desempeño de modelo archivada
  - El modo offline del harness solo valida estructura, no extracción real

prompt_text: |
  Analiza el texto libre de motivación del postulante y extrae la información en un objeto JSON con las siguientes claves exactas:
  - "nombre": Nombre completo del postulante.
  - "email": Correo electrónico.
  - "telefono": Teléfono de contacto.
  - "interes": Área temática de interés manifestada.
  - "alineacion_mision": Calificación entera de 0 a 4 sobre su compromiso con objetivos cívicos/transformación social.
  - "disponibilidad_tiempo": Calificación entera de 0 a 4 sobre su tiempo disponible implícito o explícito.
  - "impacto_territorial": Calificación entera de 0 a 4 sobre el alcance (barrial, municipal o regional) de su propuesta.

  Devuelve únicamente el objeto JSON crudo, sin bloques de código ni texto adicional.

ejemplos:
  - input: |
      Hola, me llamo Carlos. Quiero participar en el programa de
      liderazgo. Mi correo es carlos.ejemplo@mail.test y mi teléfono es
      +56 9 1000 0001. Tengo alta disponibilidad.
    expected: |
      {
        "nombre": "Carlos",
        "email": "carlos.ejemplo@mail.test",
        "telefono": "+56 9 1000 0001",
        "interes": "Programa de liderazgo",
        "alineacion_mision": 2,
        "disponibilidad_tiempo": 4,
        "impacto_territorial": 2
      }

evaluacion:
  suite_canonica: evaluations/casos-prueba/intake-test-set.yaml
  metricas:
    - tipo: exactitud_extraccion
      objetivo: ">=95%"
      metodo: Comparar con ground truth (requiere modo model)
    - tipo: coherencia_estructura
      objetivo: "100%"
      metodo: JSON válido y campos requeridos en todas las respuestas
  evidencia_formal: offline-estructural
  criterios_aceptacion:
    - "Todos los campos requeridos presentes"
    - "No hay respuestas vacías cuando info disponible"
    - "Formato JSON correcto"
    - "No inventar datos ausentes en el input"

supervision_humana:
  requerida: si
  forma: "Revisor manual valida muestra de respuestas antes de cualquier uso operativo"
  frecuencia: "En cada promoción de versión y semanal si hay piloto"
  responsable: "Coordinador de Formación"

revisiones:
  - fecha: 2026-09-06
    version: 1.0.0
    cambio: "Versión inicial documentada"
    revisado_por: "Equipo Técnico"
    aprobado_por: null
  - fecha: 2026-09-10
    version: 1.0.0
    cambio: "Estado rebajado a prueba; riesgo medio por PII potencial."
    revisado_por: "Auditoría práctica MVP"
    aprobado_por: null
  - fecha: 2026-10-01
    version: 1.0.0
    cambio: "Ampliación de campos para extracción de criterios de admisión (Paso 1)."
    revisado_por: "Sanidad de Gobernanza"
    aprobado_por: null
